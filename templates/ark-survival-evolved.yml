slug: ark-survival-evolved
name: ARK Survival Evolved
tag: Survival PvE/PvP
image: hermsi1337/ark-server:latest
cmd: ""
min_ram_mb: 4096
min_cpu: 2
supported_oses: [linux]

ports:
  - { label: game,    container: 7777,  protocol: udp, required: true }
  - { label: query,   container: 27015, protocol: udp, required: true }
  - { label: rcon,    container: 27020, protocol: tcp, required: false }

tiers:
  - { name: klein,    ram_mb: 6144,  cpu: 4, slots: 20,  hourly_credit: 10.0 }
  - { name: standard, ram_mb: 10240, cpu: 6, slots: 50,  hourly_credit: 16.0 }
  - { name: gross,    ram_mb: 16384, cpu: 8, slots: 100, hourly_credit: 24.0 }

properties:
  - name: SESSION_NAME
    env: SESSION_NAME
    rules: "string|maxlen:64"
    default: "Wildblood ARK Server"
  - name: SERVER_PASSWORD
    env: SERVER_PASSWORD
    rules: "string|maxlen:32"
    default: ""
  - name: ADMIN_PASSWORD
    env: ADMIN_PASSWORD
    rules: "required|string|maxlen:32"
    default: ""
  - name: MAP_NAME
    env: MAP_NAME
    rules: "enum:TheIsland,TheCenter,ScorchedEarth,Ragnarok,Aberration,Extinction,Valguero,Genesis,CrystalIsles,Genesis2,LostIsland,Fjordur"
    default: "TheIsland"
  - name: MAX_PLAYERS
    env: MAX_PLAYERS
    rules: "int|min:1|max:100"
    default: "70"
  - name: BATTLEEYE
    env: BATTLEEYE
    rules: "bool"
    default: "false"
  - name: RCON_ENABLED
    env: RCON_ENABLED
    rules: "bool"
    default: "true"
  - name: MOD_IDS
    env: MOD_IDS
    rules: "string|maxlen:500"
    default: ""