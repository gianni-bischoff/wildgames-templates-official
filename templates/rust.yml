slug: rust
name: Rust
tag: Survival PvP
image: pfeiffermax/rust-game-server:latest
cmd: "+server.ip 0.0.0.0 +server.port 28015 +rcon.ip 0.0.0.0 +rcon.port 28016"
min_ram_mb: 4096
min_cpu: 2
supported_oses: [linux]

ports:
  - { label: game,  container: 28015, protocol: udp, required: true }
  - { label: rcon,  container: 28016, protocol: tcp, required: true }

tiers:
  - { name: klein,    ram_mb: 8192,  cpu: 4, slots: 50,  hourly_credit: 12.0 }
  - { name: standard, ram_mb: 12288, cpu: 6, slots: 100, hourly_credit: 18.0 }
  - { name: gross,    ram_mb: 16384, cpu: 8, slots: 200, hourly_credit: 25.0 }

properties:
  - name: SERVER_NAME
    env: SERVER_NAME
    rules: "string|maxlen:64"
    default: "Wildblood Rust Server"
  - name: SERVER_IDENTITY
    env: SERVER_IDENTITY
    rules: "string|maxlen:32"
    default: "wildblood"
  - name: MAX_PLAYERS
    env: SERVER_MAXPLAYERS
    rules: "int|min:1|max:500"
    default: "100"
  - name: WORLD_SIZE
    env: SERVER_WORLDSIZE
    rules: "int|min:1000|max:6000"
    default: "3000"
  - name: SEED
    env: SERVER_SEED
    rules: "string|maxlen:10"
    default: ""
  - name: SERVER_HOSTNAME
    env: SERVER_HOSTNAME
    rules: "string|maxlen:64"
    default: "Wildblood Rust Server"
  - name: RCON_PASSWORD
    env: RCON_PASSWORD
    rules: "string|maxlen:32"
    default: ""
  - name: TICKRATE
    env: SERVER_TICKRATE
    rules: "int|min:10|max:60"
    default: "30"